<!DOCTYPE html>
<html lang="ru">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="manifest" href="manifest.json">
  <title>Рабочие часики</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #E5E9FF;
      --card: #00559b;
      --text: #020202;
      --muted: #fcfbfd;
      --border: #ff00c8;
      --accent: #2563eb;
      --accent-light: #00559b;
      --success: #050505;
      --currency: #ff00c8;
      --neon-green: #e6f701;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 130px;
    }

    header {
      background: var(--card);
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 25px;
      line-height: 1.2;
      font-weight: 750;
    }

    .controls {
      display: grid;
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--border);
      background: #aeaeb1;
      color: var(--text);
      border-radius: 12px;
      font-size: 18px;
      padding: 13px 14px;
      min-height: 50px;
      outline: none;
      appearance: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(77, 12, 151, 0.753);
    }

    .month-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .rate-wrapper {
      position: relative;
    }

    .rate-wrapper input {
      padding-right: 55px;
    }

    .currency {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
      pointer-events: none;
    }

    main {
      padding: 14px 12px;
    }

    .days-header {
      display: grid;
      grid-template-columns: 1fr 180px;
      padding: 0 10px 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .days {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .day {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 13px;
      min-height: 75px;
      display: grid;
      grid-template-columns: 1fr 180px;
      align-items: center;
      padding: 8px 10px;
      transition: 0.15s ease;
    }

    .day.today {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .day-info {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .day-number {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fdfcfc;
      font-size: 16px;
      font-weight: 750;
      margin-right: 10px;
    }

    .today .day-number {
      background: var(--accent);
      color: #050505;
    }

    .day-text {
      min-width: 0;
    }

    .weekday {
      font-size: 15px;
      font-weight: 650;
      white-space: nowrap;
    }

    .date {
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
    }

    .time-range-block {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .time-pick {
      width: 78px !important;
      min-height: 40px !important;
      padding: 6px 4px !important;
      font-size: 15px !important;
      text-align: center;
      font-weight: 700;
      border-radius: 8px !important;
      background: #012997 !important;
      color: var(--muted) !important;
    }

    .time-dash {
      color: var(--border);
      font-weight: bold;
    }

    .day-calculated-hours {
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: var(--neon-green);
      font-weight: 700;
      margin-top: 2px;
    }

    .weekend .weekday {
      color: var(--neon-green);
    }

    .summary {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      background: rgba(0, 0, 0, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    }

    .summary-inner {
      max-width: 600px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .summary-card {
      background: #f7f8fa;
      border-radius: 12px;
      padding: 10px 12px;
      min-width: 0;
    }

    .summary-label {
      color: #4e4b4e;
      font-size: 11px;
      font-weight: 650;
      margin-bottom: 3px;
    }

    .summary-value {
      font-size: 20px;
      line-height: 1.2;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .earnings {
      color: var(--success);
    }

    @media (min-width: 500px) {
      header {
        margin-top: 15px;
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .app {
        padding-left: 10px;
        padding-right: 10px;
      }
      .summary {
        background: transparent;
        border: 0;
      }
      .summary-inner {
        background: rgba(0, 0, 0, 0.96);
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 16px;
      }
    }

    /* Индикатор обновления */
    #ptr-indicator {
        position: fixed;
        top: -50px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 40px;
        background: #0c0c0c;
        border-radius: 50%;
        box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: top 0.1s ease, transform 0.2s ease;
        z-index: 9999;
    }
    #ptr-indicator svg {
        width: 20px;
        height: 20px;
        fill: #007bff;
        transition: transform 0.2s;
    }
    .ptr-loading svg {
        animation: ptr-spin 0.8s linear infinite;
    }
    @keyframes ptr-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="ptr-indicator">
    <svg viewBox="0 0 24 24">
        <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
    </svg>
  </div>

  <div class="app">
    <header>
      <h1>Рабочие часы</h1>
      <div class="controls">
        <div class="field">
          <label>Месяц</label>
          <div class="month-row">
            <select id="monthSelect" aria-label="Месяц"></select>
            <select id="yearSelect" aria-label="Год"></select>
          </div>
        </div>
        <div class="field">
          <label for="rateInput">Часовая ставка</label>
          <div class="rate-wrapper">
            <input id="rateInput" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Например, 15" autocomplete="off" />
            <span class="currency" style="color: #000000; font-weight: 750;">/ Zl-Час</span>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div class="days-header">
        <span>День</span>
        <span style="text-align:center;">Интервал времени</span>
      </div>
      <div id="daysList" class="days"></div>
    </main>
  </div>

  <div class="summary">
    <div class="summary-inner">
      <div class="summary-card">
        <div class="summary-label">ВСЕГО ЧАСОВ</div>
        <div id="totalHours" class="summary-value">0 ч</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">ЗАРАБОТОК</div>
        <div id="totalEarnings" class="summary-value earnings">0</div>
      </div>
    </div>
  </div>
<style>
    /* Индикатор обновления */
    #ptr-indicator {
        position: fixed;
        top: -50px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 40px;
        background: #ffffff;
        border-radius: 50%;
        box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: top 0.1s ease, transform 0.2s ease;
        z-index: 9999;
    }
    /* Иконка стрелочки внутри */
    #ptr-indicator svg {
        width: 20px;
        height: 20px;
        fill: #007bff;
        transition: transform 0.2s;
    }
    /* Класс для анимации вращения во время обновления */
    .ptr-loading svg {
        animation: ptr-spin 0.8s linear infinite;
    }
    @keyframes ptr-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
</style>

<h1 id="title"></h1>
<button id="button"></button>

<script>
const translations = {
    ru: {
        title: "Добро пожаловать",
        button: "Продолжить"
    },
    en: {
        title: "Welcome",
        button: "Continue"
    },
    pl: {
        title: "Witamy",
        button: "Kontynuuj"
    }
};

const language = navigator.language.split("-")[0];
const lang = translations[language] ? language : "en";

document.getElementById("title").textContent = translations[lang].title;
document.getElementById("button").textContent = translations[lang].button;
</script>
  <script>
    const monthSelect = document.getElementById('monthSelect');
    const yearSelect = document.getElementById('yearSelect');
    const rateInput = document.getElementById('rateInput');
    const daysList = document.getElementById('daysList');
    const totalHoursEl = document.getElementById('totalHours');
    const totalEarningsEl = document.getElementById('totalEarnings');

    const months = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
    const weekdays = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

    const now = new Date();
    const currentYear = now.getFullYear();
    for (let i = currentYear - 2; i <= currentYear + 2; i++) {
        let opt = document.createElement('option');
        opt.value = i; opt.textContent = i;
        if(i === currentYear) opt.selected = true;
        yearSelect.appendChild(opt);
    }
    months.forEach((m, idx) => {
        let opt = document.createElement('option');
        opt.value = idx; opt.textContent = m;
        if(idx === now.getMonth()) opt.selected = true;
        monthSelect.appendChild(opt);
    });

    rateInput.value = localStorage.getItem('savedRate') || '';

    function renderCalendar() {
        daysList.innerHTML = '';
        const year = parseInt(yearSelect.value);
        const month = parseInt(monthSelect.value);
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        const storageKey = `hours_data_${year}_${month}`;
        const savedMonthData = JSON.parse(localStorage.getItem(storageKey)) || {};

        for (let d = 1; d <= daysInMonth; d++) {
            const dateObj = new Date(year, month, d);
            const dayOfWeek = dateObj.getDay();
            const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
            const isToday = (now.getDate() === d && now.getMonth() === month && now.getFullYear() === year);

            const dayRow = document.createElement('div');
            dayRow.className = `day${isWeekend ? ' weekend' : ''}${isToday ? ' today' : ''}`;

            const formattedDate = `${String(d).padStart(2, '0')}.${String(month + 1).padStart(2, '0')}.${year}`;
            const dayValues = savedMonthData[d] || { start: '', end: '' };

            dayRow.innerHTML = `
                <div class="day-info">
                    <div class="day-number">${d}</div>
                    <div class="day-text">
                        <div class="weekday">${weekdays[dayOfWeek]}</div>
                        <div class="date">${formattedDate}</div>
                    </div>
                </div>
                <div class="time-range-block">
                    <input type="time" class="time-pick start-time" data-day="${d}" value="${dayValues.start}">
                    <span class="time-dash">—</span>
                    <input type="time" class="time-pick end-time" data-day="${d}" value="${dayValues.end}">
                    <div class="day-calculated-hours" id="calc_text_${d}">0 ч</div>
                </div>
            `;
            daysList.appendChild(dayRow);
        }
        setupListeners();
        calculateTotalAndSave();
    }

    function computeHours(start, end) {
        if (!start || !end) return 0;
        const [sh, sm] = start.split(':').map(Number);
        const [eh, em] = end.split(':').map(Number);
        let sMin = sh * 60 + sm;
        let eMin = eh * 60 + em;
        if (eMin < sMin) eMin += 24 * 60; 
        return (eMin - sMin) / 60;
    }

    function calculateTotalAndSave() {
        const year = yearSelect.value;
        const month = monthSelect.value;
        const storageKey = `hours_data_${year}_${month}`;
        
        let grandTotalHours = 0;
        const monthDataToSave = {};

        const rows = daysList.querySelectorAll('.day');
        rows.forEach(row => {
            const startInput = row.querySelector('.start-time');
            const endInput = row.querySelector('.end-time');
            const d = startInput.getAttribute('data-day');

            const sVal = startInput.value;
            const eVal = endInput.value;

            monthDataToSave[d] = { start: sVal, end: eVal };

            const hours = computeHours(sVal, eVal);
            const displayEl = document.getElementById(`calc_text_${d}`);
            
            if(hours > 0) {
                displayEl.textContent = `${hours.toFixed(2)} ч`;
                grandTotalHours += hours;
            } else {
                displayEl.textContent = '0 ч';
            }
        });

        localStorage.setItem(storageKey, JSON.stringify(monthDataToSave));

        totalHoursEl.textContent = `${grandTotalHours.toFixed(2)} ч`;
        const rate = parseFloat(rateInput.value) || 0;
        totalEarningsEl.textContent = `${(grandTotalHours * rate).toFixed(2)} Zl`;
    }

    function setupListeners() {
        daysList.querySelectorAll('.time-pick').forEach(input => {
            input.addEventListener('input', calculateTotalAndSave);
        });
    }

    monthSelect.addEventListener('change', renderCalendar);
    yearSelect.addEventListener('change', renderCalendar);
    rateInput.addEventListener('input', () => {
        localStorage.setItem('savedRate', rateInput.value);
        calculateTotalAndSave();
    });

    renderCalendar();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
            .then((reg) => {
                if (navigator.onLine) reg.update(); 
                reg.addEventListener('updatefound', () => {
                    const newWorker = reg.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            caches.keys().then(names => { for (let n of names) caches.delete(n); });
                            window.location.reload();
                        }
                    });
                });
            });
    }

    const ptr = document.getElementById('ptr-indicator');
    let startY = 0, currentY = 0, isPulling = false;

    window.addEventListener('touchstart', (e) => {
        if (window.scrollY === 0) { startY = e.touches.pageY; isPulling = true; }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
        if (!isPulling) return;
        currentY = e.touches.pageY;
        const pullDistance = currentY - startY;
        if (pullDistance > 0 && pullDistance < 150) {
            ptr.style.top = `${-50 + pullDistance * 0.6}px`;
            ptr.querySelector('svg').style.transform = `rotate(${pullDistance * 2}deg)`;
        }
    }, { passive: true });

    window.addEventListener('touchend', () => {
        if (!isPulling) return;
        isPulling = false;
        if ((currentY - startY) > 70) {
            ptr.style.top = '20px';
            ptr.classList.add('ptr-loading');
            setTimeout(() => { window.location.reload(); }, 800);
        } else {
            ptr.style.top = '-50px';
        }
    });
  </script>
  <!-- Сам элемент крутилки (оставляем один раз) -->
<div id="ptr-indicator">
    <svg viewBox="0 0 24 24">
        <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
    </svg>
</div>

<script>
    // ИСПРАВЛЕНО: Объявляем переменные свайпа строго ОДИН раз за весь файл
    const myPtr = document.getElementById('ptr-indicator');
    let pStartY = 0;
    let pCurrentY = 0;
    let pIsPulling = false;

    // Срабатывает, когда палец касается экрана
    window.addEventListener('touchstart', (e) => {
        if (window.scrollY === 0 && e.touches.length > 0) {
            pStartY = e.touches[0].pageY;
            pCurrentY = pStartY;
            pIsPulling = true;
        }
    }, { passive: true });

    // Срабатывает при движении пальца
    window.addEventListener('touchmove', (e) => {
        if (!pIsPulling || e.touches.length === 0) return;
        
        pCurrentY = e.touches[0].pageY;
        const pullDistance = pCurrentY - pStartY;

        // Если тянем вниз
        if (pullDistance > 0 && pullDistance < 150) {
            myPtr.style.top = `${-50 + pullDistance * 0.6}px`;
            myPtr.querySelector('svg').style.transform = `rotate(${pullDistance * 2}deg)`;
        }
    }, { passive: true });

    // Срабатывает, когда палец отпускают
    window.addEventListener('touchend', () => {
        if (!pIsPulling) return;
        pIsPulling = false;

        const pullDistance = pCurrentY - pStartY;

        if (pullDistance > 70) {
            myPtr.style.top = '20px'; 
            myPtr.classList.add('ptr-loading'); 
            
            // Очищаем кэш PWA на iPhone перед жестким обновлением
            if ('caches' in window) {
                caches.keys().then(names => { for (let n of names) caches.delete(n); });
            }

            setTimeout(() => {
                window.location.reload();
            }, 600);
        } else {
            myPtr.style.top = '-50px';
        }
        
        pStartY = 0;
        pCurrentY = 0;
    });

    window.addEventListener('touchcancel', () => {
        pIsPulling = false;
        myPtr.style.top = '-50px';
        pStartY = 0;
        pCurrentY = 0;
    });
</script>

</body>
</html>
